version: 2

project_name: portkiller

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X PortKiller/internal/version.Version={{.Version}}
      - -X PortKiller/internal/version.Commit={{.ShortCommit}}
      - -X PortKiller/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc